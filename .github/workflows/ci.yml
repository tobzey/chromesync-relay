name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Require Chrome for browser integration tests
        run: node --input-type=module -e "import {resolveChromePath} from './companion/host-core.js'; if (!resolveChromePath()) process.exit(1)"
      - run: npm test
      - run: npm pack --dry-run
